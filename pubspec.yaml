publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_storage: ^13.5.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^11.0.3
  csv: ^6.0.0
  excel: ^4.0.6
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
